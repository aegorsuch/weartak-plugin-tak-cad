name: Release testing checklist

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to test
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: release-testing-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: ci/release-testing
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_TESTER: ${{ vars.RELEASE_TESTER }}
        with:
          script: |
            const { createChecklist } = require('./ci/release-testing/create_checklist.cjs');
            await createChecklist({ github, context, core, tag: process.env.RELEASE_TAG, tester: process.env.RELEASE_TESTER });
