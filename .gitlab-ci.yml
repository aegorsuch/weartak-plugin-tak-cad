workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

stages:
  - verify

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/.ci-tools/android-sdk"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.ci-tools/android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  WEARTAK_SDK_SOURCE: "$CI_PROJECT_DIR/.ci-sdk"
  WEARTAK_PLUGIN_SDK_AAR: "$CI_PROJECT_DIR/.ci-sdk/build/outputs/aar/weartak-plugin-sdk-debug.aar"

release-checklist-tests:
  stage: verify
  image: node:22-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da
  timeout: 5m
  interruptible: true
  script:
    - node --test ci/release-testing/create_checklist.test.cjs

forge-verify:
  stage: verify
  image: gradle:8.10.2-jdk17@sha256:c2900027f3f0681c2cbfb09d527813851ad67aeafbb409997297efa2df20e748
  timeout: 45m
  interruptible: true
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends python3 git ca-certificates
    - |
      set -eu
      if [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH:-}" ] \
        && [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ] \
        && [ "${CI_PIPELINE_SOURCE:-}" = "push" ]; then
        for var in WEARTAK_RELEASE_KEYSTORE_B64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
          if [ -z "$(printenv "$var")" ]; then
            echo "ERROR: Missing required protected signing variable: $var" >&2
            exit 1
          fi
        done
        printf '%s' "$WEARTAK_RELEASE_KEYSTORE_B64" | base64 --decode > "$CI_PROJECT_DIR/app/weartak.keystore"
        chmod 600 "$CI_PROJECT_DIR/app/weartak.keystore"
        cat > "$CI_PROJECT_DIR/signing.properties" <<EOF
      RELEASE_KEYSTORE_FILE=app/weartak.keystore
      RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
      RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS
      RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
      EOF
        chmod 600 "$CI_PROJECT_DIR/signing.properties"
        keytool -list -keystore "$CI_PROJECT_DIR/app/weartak.keystore" \
          -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null
        echo "Protected WearTAK production signing configuration verified."
      fi
  script:
    - python3 ci/check_repository_credentials.py
    - python3 -m unittest discover -s ci -p "test_*.py" -v
    - python3 ci/setup_android.py
    - python3 ci/fetch_sdk.py --directory "$WEARTAK_SDK_SOURCE" --checkout-only
    - gradle --no-daemon --console=plain -p "$WEARTAK_SDK_SOURCE" testDebugUnitTest testReleaseUnitTest assembleDebug assembleRelease
    - test -f "$WEARTAK_PLUGIN_SDK_AAR"
    - gradle --no-daemon --console=plain :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease
    - |
      if [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH:-}" ] \
        && [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ] \
        && [ "${CI_PIPELINE_SOURCE:-}" = "push" ]; then
        python3 ci/verify_release_signature.py \
          app/build/outputs/apk/release/app-release.apk \
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
          dist
      fi
  after_script:
    - rm -f "$CI_PROJECT_DIR/app/weartak.keystore" "$CI_PROJECT_DIR/signing.properties"
  artifacts:
    when: always
    name: "TAK-CAD-${CI_COMMIT_SHORT_SHA}"
    expire_in: 30 days
    paths:
      - app/build/reports/
      - app/build/test-results/
      - .ci-sdk/build/reports/
      - .ci-sdk/build/test-results/
      - dist/TAK-CAD-production.apk
      - dist/SHA256SUMS
    reports:
      junit:
        - app/build/test-results/test*UnitTest/TEST-*.xml
        - .ci-sdk/build/test-results/test*UnitTest/TEST-*.xml

# Production signing is checked only on protected default-branch pushes using the
# inherited masked variables. Only the certificate-verified APK and SHA256SUMS are
# retained for 30 days. No GitHub APK publisher is enabled.
