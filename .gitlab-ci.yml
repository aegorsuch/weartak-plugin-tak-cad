workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

stages:
  - verify

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/.ci-tools/android-sdk"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.ci-tools/android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  WEARTAK_SDK_SOURCE: "$CI_PROJECT_DIR/.ci-sdk"
  WEARTAK_PLUGIN_SDK_AAR: "$CI_PROJECT_DIR/.ci-sdk/build/outputs/aar/weartak-plugin-sdk-debug.aar"

release-checklist-tests:
  stage: verify
  image: node:22-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da
  timeout: 5m
  interruptible: true
  script:
    - node --test ci/release-testing/create_checklist.test.cjs

forge-verify:
  stage: verify
  image: gradle:8.10.2-jdk17@sha256:c2900027f3f0681c2cbfb09d527813851ad67aeafbb409997297efa2df20e748
  timeout: 45m
  interruptible: true
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends python3 git ca-certificates
  script:
    - python3 -m unittest discover -s ci -p "test_*.py" -v
    - python3 ci/setup_android.py
    - python3 ci/fetch_sdk.py --directory "$WEARTAK_SDK_SOURCE" --checkout-only
    - gradle --no-daemon --console=plain -p "$WEARTAK_SDK_SOURCE" testDebugUnitTest testReleaseUnitTest assembleDebug assembleRelease
    - test -f "$WEARTAK_PLUGIN_SDK_AAR"
    - gradle --no-daemon --console=plain :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - app/build/reports/
      - app/build/test-results/
      - .ci-sdk/build/reports/
      - .ci-sdk/build/test-results/
    reports:
      junit:
        - app/build/test-results/test*UnitTest/TEST-*.xml
        - .ci-sdk/build/test-results/test*UnitTest/TEST-*.xml

# No publish job: app has no authorized production signing configuration.
# Debug and unsigned release APKs are deliberately excluded from artifacts.
